name: PDF and Overleaf package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk lmodern tex-gyre texlive-latex-extra texlive-fonts-recommended texlive-lang-english
      - name: Validate and compile
        run: make pdf overleaf
      - uses: actions/upload-artifact@v7
        with:
          name: airport-pdf-and-overleaf
          path: |
            output/pdf/north-airport.pdf
            output/airport-overleaf.zip
          if-no-files-found: error
          retention-days: 30
